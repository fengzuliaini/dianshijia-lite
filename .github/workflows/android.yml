name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 支持在 GitHub 界面上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
 
    - name: Download and set up Gradle 7.4
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.4-bin.zip
        unzip -q gradle-7.4-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-7.4/bin" >> $GITHUB_PATH

    - name: Build with Gradle
      run: gradle assembleDebug --stacktrace > build.log 2>&1

    - name: Commit and Push build log on failure
      if: failure()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add build.log
        git commit -m "build failed: upload log [skip ci]"
        git push origin master

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DianshijiaLite-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Diagnose Secrets
      run: |
        if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "VPS_HOST is EMPTY"; else echo "VPS_HOST is CONFIGURED"; fi
        if [ -z "${{ secrets.VPS_USERNAME }}" ]; then echo "VPS_USERNAME is EMPTY"; else echo "VPS_USERNAME is CONFIGURED"; fi
        if [ -z "${{ secrets.VPS_PASSWORD }}" ]; then echo "VPS_PASSWORD is EMPTY"; else echo "VPS_PASSWORD is CONFIGURED"; fi
        if [ -z "${{ secrets.VPS_PORT }}" ]; then echo "VPS_PORT is EMPTY"; else echo "VPS_PORT is CONFIGURED"; fi
        if [ -z "${{ secrets.VPS_TARGET_DIR }}" ]; then echo "VPS_TARGET_DIR is EMPTY"; else echo "VPS_TARGET_DIR is CONFIGURED"; fi

    - name: Generate update.json
      run: |
        VERSION_CODE=$(grep -E 'versionCode\s+' app/build.gradle | awk '{print $2}')
        VERSION_NAME=$(grep -E 'versionName\s+' app/build.gradle | awk '{print $2}' | tr -d '"')
        if [ -z "$VERSION_CODE" ]; then VERSION_CODE="19"; fi
        if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.6.0"; fi
        echo "{" > update.json
        echo "  \"versionCode\": $VERSION_CODE," >> update.json
        echo "  \"versionName\": \"$VERSION_NAME\"," >> update.json
        echo "  \"apkUrl\": \"https://my.3223516.xyz/dianshijia-lite.apk\"," >> update.json
        echo "  \"apkUrl64\": \"https://my.3223516.xyz/dianshijia-lite.apk\"," >> update.json
        echo "  \"updateMessage\": \"发现新版本 $VERSION_NAME ($VERSION_CODE)！\\\n【本次核心优化与功能】：\\\n1. 【全新7天回看节目单系统】：参考 mytv-android 深度重构，支持在侧边栏按 7 天日期（今天/昨天/前天/大前天...）分类浏览全量节目单与一键时移播放；\\\n2. 【无EPG全时段虚拟推算】：未提供 XML 节目单的频道自动自适应生成 24 小时时移段，实现全频道 7 天 24 小时无死角回看；\\\n3. 【M3U 标准回看协议适配】：全面兼容 catchup/catchup-source 模板变量自动替换及三大运营商 PLTV/TVOD 协议；\\\n4. 【硬件解码崩溃自愈】：新增硬解失败自动无缝降级为内置 FFmpeg 纯软解重试机制，彻底消灭老旧机顶盒黑屏闪退；\\\n5. 【播放器探测与代理增强】：探测包由 64KB 扩充至 512KB 解决高清流参数丢失，修复本地代理漏掉 AES-128 加密密钥的问题！\"" >> update.json
        echo "}" >> update.json
        cp app/build/outputs/apk/debug/app-debug.apk dianshijia-lite.apk

    - name: Deploy to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_PORT }}
        source: "dianshijia-lite.apk,update.json"
        target: ${{ secrets.VPS_TARGET_DIR }}
        strip_components: 0
